<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sw1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="winchAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#sw1)"/>

  <!-- Winching car out of roadside ditch/mud / basement slope -->
  <!-- Sloping ground / road edge -->
  <polygon points="0,210 180,210 380,160 400,160 400,240 0,240" fill="#1E293B"/>
  <line x1="180" y1="210" x2="380" y2="160" stroke="#FFB703" stroke-width="4"/>

  <!-- Tow Truck boom on higher ground -->
  <g transform="translate(230, 70)">
    <!-- Heavy Duty Crane Boom -->
    <line x1="70" y1="90" x2="10" y2="20" stroke="#FFB703" stroke-width="8"/>
    <line x1="90" y1="90" x2="10" y2="20" stroke="#F59E0B" stroke-width="6"/>
    <circle cx="10" cy="20" r="10" fill="#334155" stroke="#FFB703" stroke-width="3"/>
    <!-- Pulley wheel & high-tensile steel cable -->
    <path d="M10 20 L-110 95" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="6 2"/>
    <circle cx="-110" cy="95" r="5" fill="#FFB703"/>
    <!-- Hydraulic stabilizer leg planted on road -->
    <rect x="75" y="80" width="12" height="40" fill="#64748B"/>
    <rect x="68" y="120" width="26" height="8" rx="2" fill="#0B132B"/>
  </g>

  <!-- Stranded Car on lower incline being recovered -->
  <g transform="translate(40, 115) rotate(14)">
    <path d="M10 65 L10 45 Q20 35, 45 30 L65 15 Q80 8, 105 8 L125 8 Q140 8, 150 20 L160 35 L170 45 L170 65 Z" fill="#94A3B8"/>
    <path d="M70 16 L50 32 L100 32 L100 12 Z" fill="#0F172A"/>
    <path d="M105 12 L105 32 L145 32 L135 16 Z" fill="#0F172A"/>
    <circle cx="40" cy="65" r="14" fill="#0B132B" stroke="#475569" stroke-width="4"/>
    <circle cx="140" cy="65" r="14" fill="#0B132B" stroke="#475569" stroke-width="4"/>
    <!-- Recovery Hook attached to chassis tow-eye -->
    <circle cx="168" cy="50" r="4" fill="#FFB703"/>
  </g>

  <!-- Service Badge Tag -->
  <rect x="24" y="20" width="175" height="28" rx="6" fill="#FFB703"/>
  <text x="34" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#0B132B">TOW TRUCK ASSISTANCE</text>
</svg>
