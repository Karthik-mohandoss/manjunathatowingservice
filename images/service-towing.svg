<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="st1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#st1)"/>
  <!-- Road baseline -->
  <line x1="20" y1="200" x2="380" y2="200" stroke="#334155" stroke-width="4"/>
  <line x1="40" y1="200" x2="360" y2="200" stroke="#FFB703" stroke-width="2" stroke-dasharray="16 12"/>
  
  <!-- Flatbed Tow Truck carrying a Sedan -->
  <g transform="translate(40, 45)">
    <!-- Flatbed angled platform -->
    <polygon points="40,120 220,105 220,118 40,132" fill="#475569"/>
    <!-- Yellow warning rail -->
    <polygon points="45,122 215,108 215,112 45,126" fill="url(#amberG)"/>
    <!-- Truck Cabin -->
    <path d="M220 125 L220 70 L260 70 Q275 70, 285 85 L300 115 L300 125 Z" fill="#0284C7"/>
    <path d="M230 78 L260 78 L275 108 L230 108 Z" fill="#0F172A"/>
    <!-- Beacon Light on roof -->
    <rect x="235" y="62" width="30" height="8" rx="2" fill="url(#amberG)"/>
    <!-- Truck Wheels -->
    <circle cx="150" cy="138" r="18" fill="#0B132B" stroke="#64748B" stroke-width="6"/>
    <circle cx="185" cy="138" r="18" fill="#0B132B" stroke="#64748B" stroke-width="6"/>
    <circle cx="270" cy="138" r="18" fill="#0B132B" stroke="#64748B" stroke-width="6"/>
    
    <!-- Loaded Car (White/Silver Sedan) -->
    <g transform="translate(60, 42)">
      <path d="M10 70 L10 50 Q25 40, 50 36 L75 22 Q95 12, 125 12 L145 12 Q160 12, 170 28 L185 45 L190 55 L190 65 Z" fill="#F8FAFC"/>
      <path d="M80 22 L55 36 L120 36 L120 16 Z" fill="#0F172A" opacity="0.8"/>
      <path d="M125 16 L125 36 L165 36 L152 22 Z" fill="#0F172A" opacity="0.8"/>
      <circle cx="45" cy="72" r="14" fill="#0F172A" stroke="#94A3B8" stroke-width="4"/>
      <circle cx="155" cy="62" r="14" fill="#0F172A" stroke="#94A3B8" stroke-width="4"/>
      <!-- Wheel strap -->
      <path d="M35 78 Q45 58, 55 78" stroke="#FFB703" stroke-width="3" fill="none"/>
      <path d="M145 68 Q155 48, 165 68" stroke="#FFB703" stroke-width="3" fill="none"/>
    </g>
  </g>
  <!-- Service Badge Tag -->
  <rect x="24" y="20" width="130" height="28" rx="6" fill="#FFB703"/>
  <text x="34" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#0B132B">CARS ONLY</text>
</svg>
