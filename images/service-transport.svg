<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="stx1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="transAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#stx1)"/>
  <line x1="20" y1="200" x2="380" y2="200" stroke="#334155" stroke-width="4"/>

  <!-- Long Distance Car Transport on Flatbed Bed (Secured Sedan travelling between cities) -->
  <g transform="translate(30, 45)">
    <!-- Flatbed carrier chassis -->
    <rect x="30" y="110" width="230" height="20" fill="#334155"/>
    <rect x="35" y="112" width="220" height="4" fill="url(#transAmber)"/>
    <!-- Cab -->
    <path d="M260 130 L260 65 L295 65 Q310 65, 320 80 L335 110 L335 130 Z" fill="#0284C7"/>
    <path d="M270 75 L295 75 L310 105 L270 105 Z" fill="#0F172A"/>
    <!-- Wheels -->
    <circle cx="80" cy="138" r="18" fill="#0B132B" stroke="#64748B" stroke-width="6"/>
    <circle cx="120" cy="138" r="18" fill="#0B132B" stroke="#64748B" stroke-width="6"/>
    <circle cx="210" cy="138" r="18" fill="#0B132B" stroke="#64748B" stroke-width="6"/>
    <circle cx="300" cy="138" r="18" fill="#0B132B" stroke="#64748B" stroke-width="6"/>

    <!-- Premium Luxury Sedan firmly strapped to deck -->
    <g transform="translate(60, 48)">
      <path d="M10 60 L10 40 Q25 30, 50 26 L75 14 Q95 6, 125 6 L145 6 Q160 6, 170 20 L185 36 L190 46 L190 60 Z" fill="#E2E8F0"/>
      <path d="M80 14 L55 28 L120 28 L120 10 Z" fill="#0F172A" opacity="0.85"/>
      <path d="M125 10 L125 28 L165 28 L152 14 Z" fill="#0F172A" opacity="0.85"/>
      <circle cx="45" cy="62" r="14" fill="#0F172A" stroke="#94A3B8" stroke-width="4"/>
      <circle cx="155" cy="62" r="14" fill="#0F172A" stroke="#94A3B8" stroke-width="4"/>
      <!-- Ratchet Straps -->
      <path d="M35 68 Q45 48, 55 68" stroke="#FFB703" stroke-width="3" fill="none"/>
      <path d="M145 68 Q155 48, 165 68" stroke="#FFB703" stroke-width="3" fill="none"/>
    </g>
  </g>

  <!-- Service Badge Tag -->
  <rect x="24" y="20" width="180" height="28" rx="6" fill="#FFB703"/>
  <text x="34" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#0B132B">CAR TRANSPORTATION</text>
</svg>
