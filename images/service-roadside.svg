<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sr1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="roadAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#sr1)"/>
  <line x1="20" y1="200" x2="380" y2="200" stroke="#334155" stroke-width="4"/>

  <!-- Roadside Car Assistance Graphic (Battery, Tyre, Diagnostics for Cars) -->
  <g transform="translate(40, 60)">
    <!-- Battery Jumpstart Visual -->
    <rect x="30" y="70" width="85" height="60" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
    <rect x="42" y="60" width="16" height="10" rx="2" fill="#EF4444"/>
    <rect x="86" y="60" width="16" height="10" rx="2" fill="#0284C7"/>
    <!-- Plus & Minus -->
    <text x="47" y="95" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#EF4444">+</text>
    <text x="91" y="95" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#38BDF8">-</text>
    <!-- Lightning Bolt -->
    <polygon points="75,80 65,96 74,96 70,115 85,94 77,94" fill="#FFB703"/>

    <!-- Jumper cables to car -->
    <path d="M50 60 Q50 30, 110 35 T170 80" stroke="#EF4444" stroke-width="4" fill="none"/>
    <path d="M94 60 Q94 20, 140 25 T180 88" stroke="#0284C7" stroke-width="4" fill="none"/>
    
    <!-- Passenger Car side silhouette receiving aid -->
    <g transform="translate(140, 20)">
      <path d="M20 95 L20 65 Q35 50, 65 45 L95 25 Q115 15, 145 15 L175 15 Q195 15, 205 35 L215 55 L215 95 Z" fill="#334155"/>
      <path d="M95 28 L70 50 L135 50 L135 22 Z" fill="#0F172A"/>
      <path d="M140 22 L140 50 L195 50 L180 28 Z" fill="#0F172A"/>
      <circle cx="65" cy="95" r="16" fill="#0B132B" stroke="#94A3B8" stroke-width="4"/>
      <circle cx="185" cy="95" r="16" fill="#0B132B" stroke="#94A3B8" stroke-width="4"/>
      <!-- Wheel Jack lift under car -->
      <polygon points="65,95 55,120 75,120" fill="#FFB703"/>
    </g>
  </g>

  <!-- Service Badge Tag -->
  <rect x="24" y="20" width="165" height="28" rx="6" fill="#FFB703"/>
  <text x="34" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#0B132B">ROADSIDE ASSISTANCE</text>
</svg>
